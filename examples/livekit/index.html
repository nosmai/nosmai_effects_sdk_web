<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nosmai Web SDK · LiveKit loopback</title>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Nosmai + LiveKit</h1><p>Local publish-and-receive loopback</p></div>
        <strong id="state">idle</strong>
      </header>
      <form id="start-form">
        <input id="license-key" type="password" placeholder="NOSMAI-…" autocomplete="off" required />
        <button type="submit">Start loopback</button>
        <button id="stop" type="button" disabled>Stop</button>
      </form>
      <div class="grid">
        <figure><figcaption>Local Nosmai render</figcaption><canvas id="preview"></canvas></figure>
        <figure><figcaption>Received from LiveKit</figcaption><div id="remote" class="video"></div></figure>
      </div>
      <section>
        <label>Smoothing <input id="smoothing" type="range" min="0" max="1" step="0.01" value="0.45" /></label>
        <label>Local filter <input id="effect" type="file" accept=".nosmai" /></label>
        <span id="stats">— × — · — fps</span>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
